<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Radelmeter</title>
    <style>
        :root {
            --scale: 4;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #0A3547;
        }

        .container {
            transform: scale(var(--scale));
            transform-origin: top left;
            width: auto !important;
            min-width: 375px;
            max-width: 415px;
            height: 415px;
        }

        iframe {
            width: 100%;
            height: 100%;
        }

        .square {
            height: calc(0.6rem * var(--scale));
            width: calc(0.6rem * var(--scale));
            position: fixed;
            top: 0;
            left: 0;
            background-color: #0A3547;
        }
    </style>
</head>

<body>
    <div class="container">
        <iframe frameborder="0" scrolling="no"
            src="https://login.stadtradeln.de/specials/radelmeter/team/56423?L=0"></iframe>
    </div>
    <div class="square"></div>
    <div class="square" style="top: calc((415px - 0.6rem) * var(--scale));"></div>
    <div class="square" style="left: calc((415px - 0.6rem) * var(--scale));"></div>
    <div class="square"
        style="top: calc((415px - 0.6rem) * var(--scale)); left: calc((415px - 0.6rem) * var(--scale));"></div>
</body>

</html>
